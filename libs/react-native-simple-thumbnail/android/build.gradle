apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Required from AGP 8, and the manifest `package` attribute it replaces is removed
    // outright in AGP 9.
    namespace 'com.reactnativesimplethumbnail'
    // Follow the app rather than falling back to values years older than it.
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // No version: React Native's Gradle plugin contributes a strict constraint, so this
    // always matches the RN the app is built against.
    implementation 'com.facebook.react:react-android'
    // FrameExtractor: thumbnails decoded the way playback decodes. Must match the app's
    // media3 version (android/app/build.gradle) exactly.
    implementation 'androidx.media3:media3-inspector-frame:1.11.1'
    // Kotlin's stdlib comes from the Kotlin plugin the root project applies. Pinning it
    // here meant a second, older stdlib fighting the one everything else compiles against.
}
