name: Android CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  # Both jobs build the same configuration. Verify would otherwise compile the
  # recap/STT paths against an empty proxy URL and never exercise them.
  AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}

jobs:
  # `proxy/` is its own TypeScript project, excluded from the app's tsconfig, so the app's
  # typecheck never looked at it. It is the Worker that stands between every install and
  # Groq, GitHub and the subtitle APIs.
  proxy:
    name: Proxy (typecheck)
    runs-on: ubuntu-latest

    concurrency:
      group: proxy-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck proxy
        run: npx tsc -p proxy --noEmit

  verify:
    name: Verify (typecheck, lint, tests, release build)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    # A newer push to the same branch or PR makes the running check obsolete.
    # The release job below deliberately does not cancel.
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify the FFmpeg decoder AAR
        # The AAR is a binary copied in from glide-ffmpeg-decoder's CI. Its checksum file
        # comes from the same run, so a hand-built, stale or swapped AAR fails here.
        working-directory: android/app/libs
        run: sha256sum -c lib-decoder-ffmpeg-release.aar.sha256

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Create .env file
        # Secrets come in as env vars, never pasted into the script: a value holding $, `
        # or a line reading EOF is written as-is instead of running or ending the heredoc.
        env:
          STALLION_PROJECT_ID: ${{ secrets.STALLION_PROJECT_ID }}
          STALLION_APP_TOKEN: ${{ secrets.STALLION_APP_TOKEN }}
        run: |
          cat << EOF > .env
          AI_PROXY_URL=$AI_PROXY_URL
          STALLION_PROJECT_ID=$STALLION_PROJECT_ID
          STALLION_APP_TOKEN=$STALLION_APP_TOKEN
          EOF

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx jest --ci

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Native unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          # Pure-JVM tests over the player's decision logic. assembleRelease does not
          # run them, so without this step they exist but never execute.
          #
          # Scoped to modules this repository owns. The root task also runs tests inside
          # node_modules, and react-native-zip-archive ships failing ones, so an unscoped
          # invocation fails the build on a third party's code.
          ./gradlew :app:testDebugUnitTest :react-native-simple-thumbnail:testDebugUnitTest

      - name: Compile release build
        working-directory: android
        run: |
          # Release only, and one ABI. The release variant is the one that ships and the
          # only one that exercises R8 and AAR metadata, so a debug build catches a
          # strict subset of its failures for roughly the same minutes. Without this
          # step the release variant is first built by the publishing job, where a
          # failure burns a version number: v1.9.1 was spent on an AAR metadata error
          # that no debug build could have surfaced.
          #
          # Debug-signed on purpose and never uploaded -- this job has contents: read
          # and no publish step -- so it verifies compilation, R8 and AAR metadata
          # without needing the keystore secret, which fork pull requests cannot read.
          #
          # arm64 only: metadata and R8 failures are not ABI-specific, and building one
          # ABI halves the native work.
          ./gradlew assembleRelease \
            -PallowDebugSigning=true \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify the FFmpeg decoder shipped
        run: |
          set -e
          # Without it, AC-3/E-AC-3/DTS/TrueHD play silently with no error, and a release
          # APK has already once shipped with no libffmpegJNI.so. FFmpeg itself is separate
          # .so files (LGPL: replaceable), and libffmpegJNI.so fails to load without any
          # of them. The renderer is loaded by class name, so R8 dropping it fails the same.
          APK=android/app/build/outputs/apk/release/app-release.apk
          for lib in ffmpegJNI avcodec avutil swresample; do
            unzip -l "$APK" "lib/arm64-v8a/lib${lib}.so" >/dev/null \
              || { echo "::error::lib${lib}.so missing from the release APK"; exit 1; }
          done
          unzip -p "$APK" 'classes*.dex' | grep -aq 'Landroidx/media3/decoder/ffmpeg/FfmpegAudioRenderer;' \
            || { echo "::error::FfmpegAudioRenderer stripped from the release APK"; exit 1; }

  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      # Build provenance for the published APKs, so a downloaded asset can be traced
      # back to this workflow, commit and runner.
      id-token: write
      attestations: write

    concurrency:
      group: production-release
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Verify the FFmpeg decoder AAR
        # See the verify job.
        working-directory: android/app/libs
        run: sha256sum -c lib-decoder-ffmpeg-release.aar.sha256

      - name: Validate release tag and version identity
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"

          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not a strict final version (expected vX.Y.Z). Prerelease/build suffixes are rejected."
            exit 1
          fi

          # A tag on a develop commit must never publish as a production release.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not an ancestor of origin/main. Production releases are cut from main only."
            exit 1
          fi

          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version '$VERSION' does not equal package.json version '$PKG_VERSION'."
            exit 1
          fi

          # Old public tags used vX.Y.Z-build.N. Compare their SemVer portion too, so a
          # strict tag cannot silently reuse an installed version such as 1.8.1.
          PREVIOUS_VERSION=$(git tag --list \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-build\.[0-9]+)?$' \
            | grep -Fvx "$TAG" \
            | sed -E 's/^v//; s/-build\.[0-9]+$//' \
            | sort -V \
            | tail -n 1)
          if [ -n "$PREVIOUS_VERSION" ]; then
            NEWEST_VERSION=$(printf '%s\n%s\n' "$PREVIOUS_VERSION" "$VERSION" | sort -V | tail -n 1)
            if [ "$NEWEST_VERSION" != "$VERSION" ] || [ "$PREVIOUS_VERSION" = "$VERSION" ]; then
              echo "::error::Version '$VERSION' must be greater than public version '$PREVIOUS_VERSION'."
              exit 1
            fi
          fi

          # Hand-written notes for users, used for both Play's "What's new" and the GitHub
          # Release. Checked here so a missing or too-long file fails before the build.
          NOTES="release-notes/${VERSION}.txt"
          if [ ! -s "$NOTES" ]; then
            echo "::error::Missing $NOTES. Write the release notes for users before tagging."
            exit 1
          fi
          NOTES_CHARS=$(LC_ALL=C.UTF-8 wc -m < "$NOTES")
          if [ "$NOTES_CHARS" -gt 500 ]; then
            echo "::error::$NOTES is $NOTES_CHARS characters; Play's \"What's new\" allows 500."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$TAG' already exists. Never rebuild a public version in place; bump the patch version."
            exit 1
          fi

          if [[ "$AI_PROXY_URL" != https://* ]]; then
            echo "::error::Repository variable AI_PROXY_URL must contain the HTTPS production Worker URL."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Create .env file
        # Secrets come in as env vars, never pasted into the script: a value holding $, `
        # or a line reading EOF is written as-is instead of running or ending the heredoc.
        env:
          STALLION_PROJECT_ID: ${{ secrets.STALLION_PROJECT_ID }}
          STALLION_APP_TOKEN: ${{ secrets.STALLION_APP_TOKEN }}
        run: |
          cat << EOF > .env
          AI_PROXY_URL=$AI_PROXY_URL
          STALLION_PROJECT_ID=$STALLION_PROJECT_ID
          STALLION_APP_TOKEN=$STALLION_APP_TOKEN
          EOF

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx jest --ci

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Native unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          # Scoped: the root task also runs third-party tests from node_modules, some of
          # which fail. See the note in the verify job.
          ./gradlew :app:testDebugUnitTest :react-native-simple-thumbnail:testDebugUnitTest

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/glide-release.keystore
          if [ ! -s android/app/glide-release.keystore ]; then
            echo "Error: Decoded keystore is empty"
            exit 1
          fi

      - name: Build signed app bundle
        working-directory: android
        # Signed with the upload key; Play re-signs what it serves with the app signing key.
        # Gradle reads ORG_GRADLE_PROJECT_<name> as the property <name>, so the signing
        # secrets reach it without passing through the shell.
        env:
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: glide-release.keystore
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/Glide-v${VERSION}.aab"
          echo "AAB_PATH=$GITHUB_WORKSPACE/dist/Glide-v${VERSION}.aab" >> "$GITHUB_ENV"

      - name: Keep the bundle
        # Until the Play service account secret exists, this artifact is the release: upload
        # it to the internal track by hand.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Glide-v${{ env.VERSION }}-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error

      - name: Build a universal APK from the bundle
        # Only for the checks below: the same libraries and dex Play will serve, laid out
        # the way bundletool lays them out. Never published.
        run: |
          set -e
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle="$AAB_PATH" --output="$RUNNER_TEMP/check.apks"
          unzip -p "$RUNNER_TEMP/check.apks" universal.apk > "$RUNNER_TEMP/check.apk"
          echo "CHECK_APK=$RUNNER_TEMP/check.apk" >> "$GITHUB_ENV"

      - name: Verify the FFmpeg decoder shipped
        run: |
          set -e
          # See the verify job. Both ABIs, since Play serves both.
          for abi in arm64-v8a armeabi-v7a; do
            for lib in ffmpegJNI avcodec avutil swresample; do
              unzip -l "$CHECK_APK" "lib/${abi}/lib${lib}.so" >/dev/null \
                || { echo "::error::lib${lib}.so missing for ${abi}"; exit 1; }
            done
          done
          unzip -p "$CHECK_APK" 'classes*.dex' | grep -aq 'Landroidx/media3/decoder/ffmpeg/FfmpegAudioRenderer;' \
            || { echo "::error::FfmpegAudioRenderer stripped from the release build"; exit 1; }

      - name: Verify 16 KB page alignment
        run: |
          set -e
          # Android 15 and later run on 16 KB pages on some arm64 devices. A shared library
          # whose LOAD segments are aligned to less will not load there at all, and since the
          # libraries are stored uncompressed and loaded straight from the APK, their offsets
          # inside the zip must be 16 KB aligned too. 32-bit ARM has no 16 KB devices.
          LIBS=$(mktemp -d)
          unzip -q "$CHECK_APK" 'lib/arm64-v8a/*' -d "$LIBS"
          FAILED=0
          for so in "$LIBS"/lib/arm64-v8a/*.so; do
            for align in $(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if (( align < 16384 )); then
                echo "::error::$(basename "$so") has a LOAD segment aligned to $align, below 16 KB"
                FAILED=1
              fi
            done
          done
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)zipalign"
          "$ZIPALIGN" -c -P 16 4 "$CHECK_APK" \
            || { echo "::error::native libraries are not 16 KB aligned inside the APK"; FAILED=1; }
          exit $FAILED

      - name: Verify Android TV compatibility
        run: |
          set -e
          # The same bundle is the TV app. Play hides it from TVs if it has no TV launcher entry
          # or banner, or requires hardware a TV lacks (declared, or implied by a permission).
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          BADGING=$("$AAPT2" dump badging "$CHECK_APK")
          FAILED=0
          grep -q 'leanback-launchable-activity:' <<< "$BADGING" \
            || { echo "::error::no LEANBACK_LAUNCHER activity; the app won't show on Android TV"; FAILED=1; }
          grep -q "banner='" <<< "$BADGING" \
            || { echo "::error::no android:banner; Android TV requires one"; FAILED=1; }
          for feature in android.hardware.touchscreen android.hardware.faketouch android.hardware.telephony \
                         android.hardware.camera android.hardware.camera.any android.hardware.nfc \
                         android.hardware.location.gps android.hardware.microphone \
                         android.hardware.sensor.accelerometer android.hardware.screen.portrait; do
            if grep -Eq "^\s*uses-(implied-)?feature: name='$feature'" <<< "$BADGING"; then
              echo "::error::requires $feature, which TVs don't have; declare it android:required=\"false\""
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Prepare release notes
        run: |
          set -e
          # Same text for Play and GitHub; GitHub also gets the build details.
          cp "release-notes/${VERSION}.txt" whatsnew.txt
          {
            cat whatsnew.txt
            echo ""
            echo "---"
            echo "**Build Info**"
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            echo "- Date: \`$(date +'%Y-%m-%d')\`"
          } > release_notes.md

      - name: Upload to Play and fetch the Play-signed APK
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # A Play app that has never been published only accepts draft releases; set the
          # repository variable PLAY_RELEASE_STATUS=draft until the first rollout.
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          PACKAGE: com.glide.player
        run: |
          set -euo pipefail
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set. The bundle is kept as a workflow artifact only, and this GitHub Release has no APK."
            exit 0
          fi

          # Service-account OAuth token, minted here so no third-party action holds the key.
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          EMAIL=$(jq -r .client_email <<< "$PLAY_SERVICE_ACCOUNT_JSON")
          KEY_FILE=$(mktemp)
          jq -r .private_key <<< "$PLAY_SERVICE_ACCOUNT_JSON" > "$KEY_FILE"
          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          CLAIMS=$(jq -nc --arg iss "$EMAIL" --argjson now "$NOW" \
            '{iss: $iss, scope: "https://www.googleapis.com/auth/androidpublisher",
              aud: "https://oauth2.googleapis.com/token", iat: $now, exp: ($now + 3600)}' | b64url)
          SIG=$(printf '%s.%s' "$HEADER" "$CLAIMS" | openssl dgst -sha256 -sign "$KEY_FILE" | b64url)
          rm -f "$KEY_FILE"
          TOKEN=$(curl -sS --fail-with-body \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer -d "assertion=$HEADER.$CLAIMS.$SIG" \
            https://oauth2.googleapis.com/token | jq -r .access_token)
          echo "::add-mask::$TOKEN"
          AUTH="Authorization: Bearer $TOKEN"
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE"

          # One edit: upload the bundle, put it on the internal track with the notes, commit.
          EDIT=$(curl -sS --fail-with-body -X POST -H "$AUTH" "$API/edits" | jq -r .id)
          VERSION_CODE=$(curl -sS --fail-with-body -X POST -H "$AUTH" \
            -H 'Content-Type: application/octet-stream' --data-binary @"$AAB_PATH" \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT/bundles?uploadType=media" \
            | jq -r .versionCode)
          jq -n --arg name "$VERSION" --arg code "$VERSION_CODE" --arg status "$PLAY_RELEASE_STATUS" \
              --rawfile notes whatsnew.txt \
              '{track: "internal", releases: [{name: $name, versionCodes: [$code], status: $status,
                releaseNotes: [{language: "en-US", text: $notes}]}]}' \
            | curl -sS --fail-with-body -X PUT -H "$AUTH" -H 'Content-Type: application/json' \
                --data-binary @- "$API/edits/$EDIT/tracks/internal" > /dev/null
          curl -sS --fail-with-body -X POST -H "$AUTH" "$API/edits/$EDIT:commit" > /dev/null
          echo "Uploaded versionCode $VERSION_CODE to the internal track ($PLAY_RELEASE_STATUS)."

          # Play builds its signed APKs from the bundle shortly after the upload.
          DOWNLOAD_ID=""
          for _ in $(seq 1 30); do
            DOWNLOAD_ID=$(curl -sS --fail-with-body -H "$AUTH" "$API/generatedApks/$VERSION_CODE" \
              | jq -r '[.generatedApks[]?.generatedUniversalApk.downloadId // empty][0] // empty')
            [ -n "$DOWNLOAD_ID" ] && break
            sleep 20
          done
          if [ -z "$DOWNLOAD_ID" ]; then
            echo "::error::Play has not generated a universal APK for versionCode $VERSION_CODE after 10 minutes."
            exit 1
          fi
          APK="$GITHUB_WORKSPACE/dist/Glide-v${VERSION}.apk"
          curl -sS --fail-with-body -L -H "$AUTH" -o "$APK" \
            "$API/generatedApks/$VERSION_CODE/downloads/$DOWNLOAD_ID:download"
          sha256sum "$APK" > "$APK.sha256"
          # Printed so anyone can check a downloaded APK carries Play's app signing key.
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner" verify --print-certs "$APK" | grep SHA-256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/Glide-*

      - name: Create GitHub Release
        run: |
          set -e
          shopt -s nullglob
          # The Play-signed APK, when the step above fetched one. The AAB is not attached:
          # it is signed with the upload key and is of no use to anyone but Play.
          ASSETS=(dist/Glide-*.apk dist/Glide-*.apk.sha256)
          gh release create "$TAG" \
            --title "Glide ${VERSION}" \
            --notes-file release_notes.md \
            --verify-tag \
            "${ASSETS[@]}"
