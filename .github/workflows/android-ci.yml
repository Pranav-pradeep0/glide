name: Android CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  # Both jobs build the same configuration. Verify would otherwise compile the
  # recap/STT paths against an empty proxy URL and never exercise them.
  AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}

jobs:
  # `proxy/` is its own TypeScript project, excluded from the app's tsconfig, so the app's
  # typecheck never looked at it. It is the Worker that stands between every install and
  # Groq, GitHub and the subtitle APIs.
  proxy:
    name: Proxy (typecheck)
    runs-on: ubuntu-latest

    concurrency:
      group: proxy-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck proxy
        run: npx tsc -p proxy --noEmit

  verify:
    name: Verify (typecheck, lint, tests, release build)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    # A newer push to the same branch or PR makes the running check obsolete.
    # The release job below deliberately does not cancel.
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify the FFmpeg decoder AAR
        # The AAR is a binary copied in from glide-ffmpeg-decoder's CI. Its checksum file
        # comes from the same run, so a hand-built, stale or swapped AAR fails here.
        working-directory: android/app/libs
        run: sha256sum -c lib-decoder-ffmpeg-release.aar.sha256

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Create .env file
        # Secrets come in as env vars, never pasted into the script: a value holding $, `
        # or a line reading EOF is written as-is instead of running or ending the heredoc.
        env:
          STALLION_PROJECT_ID: ${{ secrets.STALLION_PROJECT_ID }}
          STALLION_APP_TOKEN: ${{ secrets.STALLION_APP_TOKEN }}
        run: |
          cat << EOF > .env
          AI_PROXY_URL=$AI_PROXY_URL
          STALLION_PROJECT_ID=$STALLION_PROJECT_ID
          STALLION_APP_TOKEN=$STALLION_APP_TOKEN
          EOF

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx jest --ci

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Native unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          # Pure-JVM tests over the player's decision logic. assembleRelease does not
          # run them, so without this step they exist but never execute.
          #
          # Scoped to modules this repository owns. The root task also runs tests inside
          # node_modules, and react-native-zip-archive ships failing ones, so an unscoped
          # invocation fails the build on a third party's code.
          ./gradlew :app:testDebugUnitTest :react-native-simple-thumbnail:testDebugUnitTest

      - name: Compile release build
        working-directory: android
        run: |
          # Release only, and one ABI. The release variant is the one that ships and the
          # only one that exercises R8 and AAR metadata, so a debug build catches a
          # strict subset of its failures for roughly the same minutes. Without this
          # step the release variant is first built by the publishing job, where a
          # failure burns a version number: v1.9.1 was spent on an AAR metadata error
          # that no debug build could have surfaced.
          #
          # Debug-signed on purpose and never uploaded -- this job has contents: read
          # and no publish step -- so it verifies compilation, R8 and AAR metadata
          # without needing the keystore secret, which fork pull requests cannot read.
          #
          # arm64 only: metadata and R8 failures are not ABI-specific, and building one
          # ABI halves the native work.
          ./gradlew assembleRelease \
            -PallowDebugSigning=true \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify the FFmpeg decoder shipped
        run: |
          set -e
          # Without it, AC-3/E-AC-3/DTS/TrueHD play silently with no error, and a release
          # APK has already once shipped with no libffmpegJNI.so. FFmpeg itself is separate
          # .so files (LGPL: replaceable), and libffmpegJNI.so fails to load without any
          # of them. The renderer is loaded by class name, so R8 dropping it fails the same.
          APK=android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          for lib in ffmpegJNI avcodec avutil swresample; do
            unzip -l "$APK" "lib/arm64-v8a/lib${lib}.so" >/dev/null \
              || { echo "::error::lib${lib}.so missing from the release APK"; exit 1; }
          done
          unzip -p "$APK" 'classes*.dex' | grep -aq 'Landroidx/media3/decoder/ffmpeg/FfmpegAudioRenderer;' \
            || { echo "::error::FfmpegAudioRenderer stripped from the release APK"; exit 1; }

  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      # Build provenance for the published APKs, so a downloaded asset can be traced
      # back to this workflow, commit and runner.
      id-token: write
      attestations: write

    concurrency:
      group: production-release
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Verify the FFmpeg decoder AAR
        # See the verify job.
        working-directory: android/app/libs
        run: sha256sum -c lib-decoder-ffmpeg-release.aar.sha256

      - name: Validate release tag and version identity
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"

          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not a strict final version (expected vX.Y.Z). Prerelease/build suffixes are rejected."
            exit 1
          fi

          # A tag on a develop commit must never publish as a production release.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not an ancestor of origin/main. Production releases are cut from main only."
            exit 1
          fi

          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version '$VERSION' does not equal package.json version '$PKG_VERSION'."
            exit 1
          fi

          # Old public tags used vX.Y.Z-build.N. Compare their SemVer portion too, so a
          # strict tag cannot silently reuse an installed version such as 1.8.1.
          PREVIOUS_VERSION=$(git tag --list \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-build\.[0-9]+)?$' \
            | grep -Fvx "$TAG" \
            | sed -E 's/^v//; s/-build\.[0-9]+$//' \
            | sort -V \
            | tail -n 1)
          if [ -n "$PREVIOUS_VERSION" ]; then
            NEWEST_VERSION=$(printf '%s\n%s\n' "$PREVIOUS_VERSION" "$VERSION" | sort -V | tail -n 1)
            if [ "$NEWEST_VERSION" != "$VERSION" ] || [ "$PREVIOUS_VERSION" = "$VERSION" ]; then
              echo "::error::Version '$VERSION' must be greater than public version '$PREVIOUS_VERSION'."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$TAG' already exists. Never rebuild a public version in place; bump the patch version."
            exit 1
          fi

          if [[ "$AI_PROXY_URL" != https://* ]]; then
            echo "::error::Repository variable AI_PROXY_URL must contain the HTTPS production Worker URL."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Create .env file
        # Secrets come in as env vars, never pasted into the script: a value holding $, `
        # or a line reading EOF is written as-is instead of running or ending the heredoc.
        env:
          STALLION_PROJECT_ID: ${{ secrets.STALLION_PROJECT_ID }}
          STALLION_APP_TOKEN: ${{ secrets.STALLION_APP_TOKEN }}
        run: |
          cat << EOF > .env
          AI_PROXY_URL=$AI_PROXY_URL
          STALLION_PROJECT_ID=$STALLION_PROJECT_ID
          STALLION_APP_TOKEN=$STALLION_APP_TOKEN
          EOF

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx jest --ci

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Native unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          # Scoped: the root task also runs third-party tests from node_modules, some of
          # which fail. See the note in the verify job.
          ./gradlew :app:testDebugUnitTest :react-native-simple-thumbnail:testDebugUnitTest

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/glide-release.keystore
          if [ ! -s android/app/glide-release.keystore ]; then
            echo "Error: Decoded keystore is empty"
            exit 1
          fi

      - name: Build signed APKs
        working-directory: android
        # Gradle reads ORG_GRADLE_PROJECT_<name> as the property <name>, so the signing
        # secrets reach it without passing through the shell.
        env:
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: glide-release.keystore
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify the FFmpeg decoder shipped
        run: |
          set -e
          # See the verify job. Both ABIs here, since both are published.
          for abi in arm64-v8a armeabi-v7a; do
            APK="android/app/build/outputs/apk/release/app-${abi}-release.apk"
            for lib in ffmpegJNI avcodec avutil swresample; do
              unzip -l "$APK" "lib/${abi}/lib${lib}.so" >/dev/null \
                || { echo "::error::lib${lib}.so missing from the ${abi} APK"; exit 1; }
            done
            unzip -p "$APK" 'classes*.dex' | grep -aq 'Landroidx/media3/decoder/ffmpeg/FfmpegAudioRenderer;' \
              || { echo "::error::FfmpegAudioRenderer stripped from the ${abi} APK"; exit 1; }
          done

      - name: Verify 16 KB page alignment
        run: |
          set -e
          # Android 15 and later run on 16 KB pages on some arm64 devices, and a shared
          # library whose LOAD segments are aligned to less will not load there at all.
          #
          # This reads the ELF headers, not the zip. The libraries are stored compressed
          # (useLegacyPackaging) and extracted at install, so zip-level alignment
          # (zipalign -P 16) says nothing about them; segment alignment is what the loader
          # checks. 32-bit ARM has no 16 KB devices, so only arm64 is checked.
          LIBS=$(mktemp -d)
          unzip -q android/app/build/outputs/apk/release/app-arm64-v8a-release.apk 'lib/arm64-v8a/*' -d "$LIBS"
          FAILED=0
          for so in "$LIBS"/lib/arm64-v8a/*.so; do
            for align in $(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if (( align < 16384 )); then
                echo "::error::$(basename "$so") has a LOAD segment aligned to $align, below 16 KB"
                FAILED=1
              fi
            done
          done
          exit $FAILED

      - name: Collect assets and checksums
        run: |
          set -e
          APK_DIR="android/app/build/outputs/apk/release"

          ARM_SRC="$APK_DIR/app-armeabi-v7a-release.apk"
          ARM64_SRC="$APK_DIR/app-arm64-v8a-release.apk"
          ARM_DEST="$APK_DIR/Glide-v${VERSION}-arm.apk"
          ARM64_DEST="$APK_DIR/Glide-v${VERSION}-arm64.apk"

          mv "$ARM_SRC" "$ARM_DEST"
          mv "$ARM64_SRC" "$ARM64_DEST"

          sha256sum "$ARM_DEST"  > "${ARM_DEST}.sha256"
          sha256sum "$ARM64_DEST" > "${ARM64_DEST}.sha256"

          echo "ARM_PATH=$ARM_DEST" >> "$GITHUB_ENV"
          echo "ARM64_PATH=$ARM64_DEST" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            ${{ env.ARM_PATH }}
            ${{ env.ARM64_PATH }}

      - name: Generate changelog from previous published release
        run: |
          set -e
          # The previous *published* release, not the newest tag. A tag whose release
          # build failed leaves an orphan tag behind (v1.9.1), and ranging from it
          # silently drops every commit between the last real release and that tag --
          # which is how 1.9.2's notes came to omit both crash fixes.
          #
          # This is the same endpoint the in-app updater reads, so the notes describe
          # exactly the jump users are taking. The release being built does not exist
          # yet at this step, so this cannot return the current tag.
          LAST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$LAST_TAG" ] || [ "$LAST_TAG" = "null" ] \
              || ! git rev-parse -q --verify "refs/tags/$LAST_TAG" >/dev/null; then
            RANGE="HEAD"
            echo "No usable previous published release. Using full history."
          else
            RANGE="${LAST_TAG}..HEAD"
            echo "Changelog range: $RANGE"
          fi

          RAW_LOG=$(git log --no-merges --pretty=format:"%s" $RANGE)
          FEATS=$(echo "$RAW_LOG" | sed -nE 's/^(feat)(\([^)]*\))?:\s*/- /p')
          FIXES=$(echo "$RAW_LOG" | sed -nE 's/^(fix)(\([^)]*\))?:\s*/- /p')
          PERFS=$(echo "$RAW_LOG" | sed -nE 's/^(perf)(\([^)]*\))?:\s*/- /p')

          BODY=""
          if [ -n "$FEATS" ]; then
            BODY="${BODY}"$'\n'"### Features"$'\n'"$FEATS"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}"$'\n'"### Fixes"$'\n'"$FIXES"
          fi
          if [ -n "$PERFS" ]; then
            BODY="${BODY}"$'\n'"### Performance"$'\n'"$PERFS"
          fi

          if [ -z "$BODY" ]; then
            LOG=$(echo "$RAW_LOG" | sed -nE 's/^/- /p')
            if [ -z "$LOG" ]; then
              LOG="- No notable changes."
            fi
            BODY="$LOG"
          else
            BODY=$(echo "$BODY" | sed '1{/^$/d}')
          fi

          {
            echo "$BODY"
            echo ""
            echo "---"
            echo "**Build Info**"
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            echo "- Date: \`$(date +'%Y-%m-%d')\`"
          } > release_notes.md

      - name: Create GitHub Release
        run: |
          set -e
          test -f "$ARM_PATH" || { echo "::error::Missing ARM APK"; exit 1; }
          test -f "$ARM64_PATH" || { echo "::error::Missing ARM64 APK"; exit 1; }

          gh release create "$TAG" \
            --title "Glide ${VERSION}" \
            --notes-file release_notes.md \
            --verify-tag \
            "$ARM_PATH" "${ARM_PATH}.sha256" \
            "$ARM64_PATH" "${ARM64_PATH}.sha256"
