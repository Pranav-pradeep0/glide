apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.net.URL

// .env at the repo root (CI writes it before building): KEY=value lines, # comments.
def env = [:]
def envFile = file("../../.env")
if (envFile.exists()) {
    envFile.eachLine { line ->
        def m = line =~ /^\s*([A-Z0-9_]+)\s*=\s*['"]?(.*?)['"]?\s*$/
        if (m.matches()) env[m.group(1)] = m.group(2)
    }
}
// What JS reads (src/utils/constants.ts), via GlideNative's `env` constant.
def jsEnvKeys = ["SUBDL_API_URL", "SUBDL_API_KEY", "SUBDL_DOWNLOAD_URL", "OMDB_API_KEY", "OMDB_API_URL",
                 "AI_PROXY_URL"]
def jsEnvJson = JsonOutput.toJson(env.subMap(jsEnvKeys))

def packageVersion = new JsonSlurper().parse(file("../../package.json")).version?.toString()
def versionMatcher = packageVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!versionMatcher.matches()) {
    throw new GradleException("package.json version must use X.Y.Z SemVer")
}

def versionMajor = versionMatcher.group(1).toLong()
def versionMinor = versionMatcher.group(2).toLong()
def versionPatch = versionMatcher.group(3).toLong()
if (versionMinor > 999 || versionPatch > 999) {
    throw new GradleException("package.json minor and patch versions must be below 1000")
}

def packageVersionCode = versionMajor * 1_000_000L + versionMinor * 1_000L + versionPatch
if (packageVersionCode < 1 || packageVersionCode > 2_100_000_000L) {
    throw new GradleException("package.json version produces an invalid Android versionCode")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true
def hasReleaseSigningConfig = project.hasProperty('MYAPP_UPLOAD_STORE_FILE') &&
        project.property('MYAPP_UPLOAD_STORE_FILE')?.toString()?.trim()

def allowDebugSigning = project.hasProperty('allowDebugSigning') &&
        project.property('allowDebugSigning').toString().toBoolean()

// A release build with no keystore used to fall back to the debug key silently.
// Play rejects a debug-signed upload, so fail the build instead.
gradle.taskGraph.whenReady { graph ->
    if (hasReleaseSigningConfig || allowDebugSigning) {
        return
    }
    boolean buildingRelease = graph.allTasks.any {
        it.path.startsWith(project.path + ':') && it.name.toLowerCase().contains('release')
    }
    if (buildingRelease) {
        throw new GradleException(
                "Release signing is not configured. Set MYAPP_UPLOAD_STORE_FILE, MYAPP_UPLOAD_KEY_ALIAS, " +
                "MYAPP_UPLOAD_STORE_PASSWORD and MYAPP_UPLOAD_KEY_PASSWORD in ~/.gradle/gradle.properties " +
                "(or pass them with -P), or pass -PallowDebugSigning=true to deliberately produce a " +
                "debug-signed release build.")
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    
    repositories {
        flatDir {
            dirs "$rootDir/libs"
        }
    }
    namespace "com.glide.app"
    defaultConfig {
        applicationId "com.glide.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode packageVersionCode as int
        versionName packageVersion
        
        // Inject Stallion keys from env
        resValue "string", "StallionProjectId", env.get("STALLION_PROJECT_ID", "")
        resValue "string", "StallionAppToken", env.get("STALLION_APP_TOKEN", "")
        buildConfigField "String", "JS_ENV", '"' + jsEnvJson.replace('\\', '\\\\').replace('"', '\\"') + '"'

    }
    splits {
        abi {
            reset()
            enable true
            universalApk false
            include(*rootProject.ext.nativeArchitectures)
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
        // Note: MYAPP_UPLOAD_* properties are loaded from ~/.gradle/gradle.properties (never committed)
        // For CI, the keystore is decoded from ANDROID_KEYSTORE_BASE64 secret
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    // Compress the native libraries in the APK, rather than storing them uncompressed as
    // modern packaging does. Glide ships whole APKs over GitHub Releases, so every update
    // is a full download on the user's mobile data -- and the .so files are 22.6 MB of a
    // 31 MB APK, about 14 MB compressed.
    //
    // The trade is that Android extracts them at install: more disk used and a slower
    // install, against half the download every release. Measure both on a device before
    // changing this back.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation project(':react-native-simple-thumbnail')
    implementation("com.facebook.react:react-android")
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.palette:palette:1.0.0"

    // The phase 1 playback core (com.glide.app.player) and the HDR spike. No longer
    // debug-only: the new engine ships behind a setting so it can be compared against VLC
    // on a real build.
    // media3-session/common are already used by the player module at the same version.
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    // Colour enhancement as GPU shaders. setVideoEffects throws IllegalStateException if
    // this is missing, and its version must match media3-exoplayer exactly.
    implementation "androidx.media3:media3-effect:1.11.1"
    // The media session and its notification. The player module declares this too, but
    // `implementation` is not transitive, so the app needs its own at the same version.
    implementation "androidx.media3:media3-session:1.11.1"
    // rtsp:// is still advertised in NavigationService/VideoPlayerScreen, and LibVLC used
    // to be what honoured it. DefaultMediaSourceFactory finds RtspMediaSource by
    // Class.forName, so having this on the classpath is the whole wiring.
    implementation "androidx.media3:media3-exoplayer-rtsp:1.11.1"
    // VideoPlayerActivity's intent filter advertises .m3u8, and DeepLinkService treats
    // http(s) as playable, but DefaultMediaSourceFactory finds HlsMediaSource and
    // DashMediaSource the same way it finds RtspMediaSource -- by Class.forName. Without
    // these on the classpath every stream failed with no source factory.
    implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.11.1"
    // Native SubtitleView for bitmap (PGS/VobSub) and text subtitles.
    implementation "androidx.media3:media3-ui:1.11.1"
    // NOT debug-only, and it must never go back to being debug-only.
    //
    // This device has no AC-3, E-AC-3, DTS or TrueHD decoder in hardware. Without this
    // AAR, DefaultRenderersFactory finds no FfmpegAudioRenderer, ExoPlayer selects no
    // audio track, and the file plays **silently with no error** — the phase 0 blocking
    // failure. It was debugImplementation while VLC was still the default and could cover
    // for it. VLC is gone, so nothing covers for it now.
    //
    // Measured: a release APK built without this shipped zero libffmpegJNI.so.
    //
    // Built by the private glide-ffmpeg-decoder repo. Consuming it as a local file means
    // a machine without the file fails the build loudly, which is the right failure —
    // replace with its GitHub Packages coordinate (plan section 4.3) so a fresh clone can
    // build at all.
    implementation files("libs/lib-decoder-ffmpeg-release.aar")

    // computeGeometry is pure arithmetic over ints and floats, so the six resize modes --
    // the part of the engine migration the plan calls the risk peak -- can be checked on
    // the JVM with no device and no Robolectric.
    testImplementation 'junit:junit:4.13.2'

    // Hermes, always. `hermesEnabled` has never been false here, and the JSC fallback it
    // guarded pulled a floating `org.webkit:android-jsc:+` version into the build.
    implementation("com.facebook.react:hermes-android")
}
